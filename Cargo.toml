[package]
name = "instantjpdict"
version = "0.1.0"
edition = "2021"
description = "Japanese OCR overlay and dictionary lookup for KDE Plasma"
license = "AGPL-3.0-or-later"

[workspace]
members = ["jpdict-core"]

[dependencies]
# UI-free OCR + dictionary pipeline (see jpdict-core/src/lib.rs for the boundary).
jpdict-core = { path = "jpdict-core" }

# Image loading for captures and viewer display
image = "0.25"
# JPEG XL decoding (the `image` crate has no native JXL support)
jxl-oxide = { version = "0.12", features = ["image"] }

# Panel font metrics (fontdue) and vertical metrics (ttf-parser) for the overlay
fontdue = "0.9"
ttf-parser = { version = "0.21", default-features = false, features = ["opentype-layout"] }

# Utilities
log = "0.4"
env_logger = "0.11"
anyhow = "1.0"

# Screenshot capture (--capture): talk to KWin's ScreenShot2 D-Bus API
zbus = { version = "5.19", features = ["blocking-api"] }

# GUI: Rune for the frontend, settings and annotated-image viewer.
# Pinned to a `dev` revision: Rune is pre-release and `dev` is never rewritten.
rune = { git = "https://github.com/anomalyco/rune", rev = "47cb857795c3b1dd5097c15d6161719ae738ddda" }

# File dialogs
rfd = "0.14"

# Platform data directories
directories = "6.0"

[profile.release]
