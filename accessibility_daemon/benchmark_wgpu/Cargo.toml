[package]
name = "benchmark_wgpu"
version = "0.1.0"
edition = "2021"

[dependencies]
burn = { path = "../burn/crates/burn", features = ["wgpu"] }
burn-store = { path = "../burn/crates/burn-store", features = ["std", "burnpack"] }
image = "0.25"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1

[[bin]]
name = "benchmark_wgpu"
path = "src/main.rs"
