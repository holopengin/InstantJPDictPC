[package]
name = "accessibility_daemon"
version = "0.1.0"
edition = "2021"

[dependencies]
# ONNX Runtime for Rust
ort = { version = "2.0.0-rc.3", features = ["webgpu"] }

# Image processing
image = "0.25"
ndarray = "0.15"

# Font rendering for labels (TTF)
rusttype = "0.9"

# Utilities
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
log = "0.4"
env_logger = "0.11"
anyhow = "1.0"
tokio = { version = "1.0", features = ["full"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
