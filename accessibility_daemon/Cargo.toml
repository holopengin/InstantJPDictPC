[package]
name = "accessibility_daemon"
version = "0.1.0"
edition = "2021"

[features]
default = ["ort"]
ort = ["dep:ort"]
burn-backend = ["dep:burn", "dep:burn-wgpu", "dep:burn-cubecl", "dep:burn-store", "dep:burn-onnx", "dep:bytemuck"]

[dependencies]
# ONNX Runtime for Rust
ort = { version = "2.0.0-rc.3", features = ["webgpu"], optional = true }

# Burn deep learning framework (wgpu backend)
burn = { path = "burn/crates/burn", features = ["wgpu", "std"], optional = true }
burn-wgpu = { path = "burn/crates/burn-wgpu", features = ["std"], optional = true }
burn-cubecl = { path = "burn/crates/burn-cubecl", features = ["std"], optional = true }
burn-store = { path = "burn/crates/burn-store", features = ["std", "burnpack"], optional = true }
burn-onnx = { path = "burn-onnx/crates/burn-onnx", features = ["mmap"], optional = true }
bytemuck = { version = "1.14", optional = true }

# Image processing
image = "0.25"
ndarray = "0.15"

# Font rendering for labels (TTF)
fontdue = "0.9"

# Utilities
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
log = "0.4"
env_logger = "0.11"
anyhow = "1.0"
tokio = { version = "1.0", features = ["full"] }

# GUI: Iced for displaying the annotated image
iced = { version= "0.14.0", features = ["image", "canvas", "advanced", "tokio"] }
iced_futures = "0.14.0"

# Database: SQLite for dictionary storage
rusqlite = { version = "0.37", features = ["bundled"] }

# Dictionary import from Yomitan ZIP files
zip = "0.6"

# Lazy static initialization
lazy_static = "1.4"

# Parallel iteration
rayon = "1.8"

# File dialogs
rfd = "0.14"

# Open URLs in browser
open = "5.0"

# Async timers (works with Iced's executor)
futures-timer = "3.0"

[profile.release]
