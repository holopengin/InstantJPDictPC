[package]
name = "accessibility_daemon"
version = "0.1.0"
edition = "2021"

[dependencies]
# ONNX Runtime for Rust
ort = { version = "2.0.0-rc.3", features = ["webgpu"] }

# Image processing
image = "0.25"
ndarray = "0.15"

# Font rendering for labels (TTF)
rusttype = "0.9"

# Utilities
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
log = "0.4"
env_logger = "0.11"
anyhow = "1.0"
tokio = { version = "1.0", features = ["full"] }

# GUI: Iced for displaying the annotated image
iced = { version= "0.14.0", features = ["image", "canvas"] }
iced_futures = "0.14.0"

# Database: SQLite for dictionary storage
rusqlite = { version = "0.31", features = ["bundled"] }

# Dictionary import from Yomitan ZIP files
zip = "0.6"

# Lazy static initialization
lazy_static = "1.4"

# File dialogs
rfd = "0.14"

# Open URLs in browser
open = "5.0"

# Async timers (works with Iced's executor)
futures-timer = "3.0"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
