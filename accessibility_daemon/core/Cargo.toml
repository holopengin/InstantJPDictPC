[package]
name = "jpdict_core"
version = "0.1.0"
edition = "2021"

[build-dependencies]
# Compiles the shared PP-OCRv6 ncnn core + C ABI (native/ppocr_ncnn)
cc = "1"

[dependencies]
# Image processing (detection letterbox, recognition crops, test inputs)
image = "0.25"
imageproc = "0.25"

# Vertical font metrics (vmtx/vert) for character geometry.
ttf-parser = { version = "0.21", default-features = false, features = ["opentype-layout"] }

# Utilities
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
log = "0.4"
anyhow = "1.0"

# Database: SQLite for dictionary storage
rusqlite = { version = "0.37", features = ["bundled"] }

# Dictionary import from Yomitan ZIP files.
# Default features would pull bzip2/zstd/aes; Yomitan archives are plain
# deflate ZIPs, and linking the system libbz2 makes the binary depend on a
# soname that differs across distros (libbz2.so.1.0 on Arch, .so.1 on Fedora).
zip = { version = "0.6", default-features = false, features = ["deflate"] }

# Catalog downloads (#71): a plain HTTPS GET with rustls + webpki roots, and
# the SHA-256 the pinned catalog entries are verified against.
ureq = { version = "2.12", default-features = false, features = ["tls"] }
sha2 = "0.10"

# Lazy static initialization
lazy_static = "1.4"
